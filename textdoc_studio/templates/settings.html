<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Settings · TextDoc</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><a class="btn ghost" href="/">← Projects</a><div class="brand">TEXTDOC <b>STUDIO</b></div></header><main class="settings"><span class="pill">YOUTUBE</span><h1>Private publishing</h1><p class="muted">Credentials stay on this machine. OAuth is used for uploads. Private is hard-coded for Studio uploads.</p><div class="field"><label>OAuth Client ID</label><input id="cid" value="{{s.client_id}}"></div><div class="field"><label>OAuth Client Secret</label><input id="secret" type="password" placeholder="{{'Saved — enter only to replace' if s.has_secret else 'Client secret'}}"></div><div class="field"><label>API Key (optional)</label><input id="key" value="{{s.api_key}}"></div><button class="btn gold" onclick="save()">Save settings</button> <a class="btn" href="/youtube/connect">{{'Reconnect YouTube' if s.connected else 'Connect YouTube'}}</a><p id="msg" class="muted">{{'● YouTube connected' if s.connected else 'Not connected yet'}}</p></main><script>async function save(){let b={client_id:cid.value,client_secret:secret.value,api_key:key.value};await fetch('/api/settings/youtube',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});msg.textContent='✓ Saved locally'}</script></body></html>
