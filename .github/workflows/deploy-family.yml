name: Test Deploy Family
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H family.local >> ~/.ssh/known_hosts

      - name: Deploy to family.local
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude=instance \
            --exclude=backups \
            --exclude=.venv \
            --exclude=node_modules \
            ./ richmack@family.local:/home/richmack/v46-new/

      - name: Reload app and Tailscale Serve
        run: |
          ssh -i ~/.ssh/id_ed25519 richmack@family.local '
            sudo pkill -HUP -f "gunicorn.*8011" 2>/dev/null || true
            sudo tailscale serve reset
            sudo tailscale serve --bg http://127.0.0.1:8011
            sleep 3
            curl -f http://127.0.0.1:8011/
          '

      - name: Playwright deployed screenshots
        env:
          BASE_URL: http://family.local:8011
        run: |
          mkdir -p docs/screenshots
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-playwright-screenshots
          path: docs/screenshots/
